<!DOCTYPE html>
<html>
<head>
    <title>AI Career Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        AI Career Assistant
    </h1>

    <div class="card p-4">

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">
                    Upload Resume (PDF)
                </label>

                <input
                    type="file"
                    class="form-control"
                    name="resume"
                    accept=".pdf"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Target Job Role
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="job_role"
                    placeholder="Machine Learning Engineer"
                    required>
            </div>

            <button
                type="submit"
                class="btn btn-primary">
                Analyze Resume
            </button>

        </form>

    </div>

</div>

</body>
</html>
